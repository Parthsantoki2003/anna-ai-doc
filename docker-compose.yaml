services:
  # ==================== Qdrant Vector Database ====================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: docuchat-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - docuchat-network
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp | grep -q '18BD' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ==================== FastAPI Backend ====================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docuchat-api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=8000
      - WORKERS=1
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - ANNA_APP_SLUG=${ANNA_APP_SLUG:-anna-document-workspace}
      - ANNA_APP_VERSION=${ANNA_APP_VERSION:-1.0.0}
      - ANNA_APP_MODE=${ANNA_APP_MODE:-cloud-compatible}
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - docuchat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

# ==================== Root Definitions ====================
networks:
  docuchat-network:
    driver: bridge

volumes:
  qdrant_storage: